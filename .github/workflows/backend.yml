name: Backend

on:
  push:
    branches: [main]
    paths: ['backend/**', 'spec/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'spec/**', '.github/workflows/backend.yml']

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Pinned rather than relying on whatever the runner image ships. The migration checker is
      # plain ESM with no dependencies, so the only thing a version drift could break is the
      # check itself — silently, and in the direction of passing.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Before compiling, because it is the cheapest check and it catches the one class of
      # mistake nothing else will: a tenant-scoped table that forgot apply_tenant_rls(). The
      # equivalent assertion in TenantIsolationTest needs a database; this one needs Node.
      - name: Check migrations
        run: |
          node backend/scripts/migration-check.selftest.mjs
          node backend/scripts/migration-check.mjs backend/src/main/resources/db/migration

      - name: Compile
        working-directory: backend
        run: ./gradlew compileKotlin compileTestKotlin

      # Runs first and separately: a module boundary violation should fail fast and with an
      # unambiguous message, not be buried in a 500-line test report.
      - name: Verify module boundaries
        working-directory: backend
        run: ./gradlew test --tests 'com.hr.ModuleStructureTest'

      # Called out separately so a spec/implementation divergence is unmistakable in the run
      # summary rather than buried in a full test report. Needs no database.
      - name: Verify API contract matches the implementation
        working-directory: backend
        run: ./gradlew test --tests 'com.hr.ApiContractTest'

      # Testcontainers needs Docker, which the ubuntu runner provides.
      - name: Test
        working-directory: backend
        run: ./gradlew test

      # The isolation suite is called out explicitly so that a failure here is impossible to
      # miss in the run summary. It is the one test whose failure must block everything.
      - name: Verify tenant isolation
        working-directory: backend
        run: ./gradlew test --tests 'com.hr.tenancy.TenantIsolationTest'

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test/
          retention-days: 14

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Dependency vulnerability scan
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Guards the rule from docs/03-architecture.md §9: the OpenAPI spec is the contract, and a
  # breaking change to a published version must not merge silently.
  contract:
    name: API contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint OpenAPI spec
        run: npx --yes @stoplight/spectral-cli lint spec/openapi.yaml --fail-severity warn

      - name: Detect breaking changes
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git show origin/${{ github.base_ref }}:spec/openapi.yaml > /tmp/base-openapi.yaml 2>/dev/null \
            || { echo "No base spec — treating as new API surface."; exit 0; }
          npx --yes @useoptic/openapi-cli diff /tmp/base-openapi.yaml spec/openapi.yaml --check
