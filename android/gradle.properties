# JVM heap for the Gradle daemon. Android builds with KSP and Compose need considerably more
# than the 512 MB default; the symptom of leaving it low is intermittent OOM during annotation
# processing, which reads as a flaky build rather than a memory problem.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache is off: AGP 8.7.3 fails to serialise MapSourceSetPathsTask under Gradle
# 8.14. Re-enable once AGP catches up — it is a meaningful build-time win, not something to
# abandon permanently.
org.gradle.configuration-cache=false

android.useAndroidX=true

# Only generate BuildConfig, R and friends for modules that declare them, rather than for every
# module transitively. Meaningful build-time saving as the module count grows.
android.nonTransitiveRClass=true
android.nonFinalResIds=true

kotlin.code.style=official

# Room's incremental annotation processing via KSP.
ksp.incremental=true
