# Local development profile — used with the Docker Compose stack in ../docker-compose.yml
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/hr
    username: hr_app_login
    password: hr_app_login

  flyway:
    url: jdbc:postgresql://localhost:5432/hr
    user: hr_owner
    password: hr_owner

  jpa:
    properties:
      hibernate:
        format_sql: true

hr:
  crypto:
    # A fixed key for local development, so encrypted columns survive a restart and the demo data
    # stays readable. Committed deliberately and safe to commit: it protects nothing real, and the
    # `local` profile cannot be enabled in a deployed environment. Every other profile requires
    # FIELD_ENCRYPTION_KEY and refuses to start without it.
    # Decodes to exactly 32 bytes: "local-dev-only-key-not-for-prod!"
    field-key: bG9jYWwtZGV2LW9ubHkta2V5LW5vdC1mb3ItcHJvZCE=

logging:
  level:
    com.hr: DEBUG
    org.hibernate.SQL: DEBUG
    # Uncomment to see bound parameters. Never enable outside local: bind parameters
    # include salaries, national ids and bank account numbers.
    # org.hibernate.orm.jdbc.bind: TRACE
