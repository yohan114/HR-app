name: hr-platform-prod

# =============================================================================
# Production Docker Compose Stack: Full Platform Topology
#
# Services:
#   - postgres: PostgreSQL 16 with RLS role separation (owner vs app)
#   - redis: Redis 7.4 with AOF persistence & password authentication
#   - redpanda: High-performance Kafka-compatible event streaming
#   - minio: Distributed S3 object store for payslips, documents, and uploads
#   - minio-init: Automatic bucket provisioning
#   - backend: Spring Boot 3 Modular Monolith (multi-stage non-root container)
#   - web: React 19 SPA + Nginx Reverse Proxy with compression & security headers
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# =============================================================================

networks:
  internal-net:
    driver: bridge
    internal: true
  public-net:
    driver: bridge

volumes:
  postgres_prod_data:
    name: hr_prod_postgres_data
  redis_prod_data:
    name: hr_prod_redis_data
  minio_prod_data:
    name: hr_prod_minio_data
  redpanda_prod_data:
    name: hr_prod_redpanda_data

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL 16 (Row-Level Security Multi-Tenancy Database)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16.8-alpine
    container_name: hr-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hr}
      POSTGRES_USER: ${POSTGRES_USER:-hr_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database owner password required}
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "log_min_duration_statement=1000"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hr_owner} -d ${POSTGRES_DB:-hr}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # 2. Redis 7.4 (Token Denylists, Rate Limits & Distributed Locks)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: hr-prod-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:?Redis password required}"
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
    volumes:
      - redis_prod_data:/data
    networks:
      - internal-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # 3. Redpanda 24.3 (Kafka-Compatible Distributed Event Stream)
  # ---------------------------------------------------------------------------
  redpanda:
    image: redpandadata/redpanda:v24.3.6
    container_name: hr-prod-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092
      - --check=false
    volumes:
      - redpanda_prod_data:/var/lib/redpanda/data
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # 4. MinIO (S3-Compatible Object Storage for Documents & Payslips)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: hr-prod-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hrminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MinIO password required}
    command: server /data
    volumes:
      - minio_prod_data:/data
    networks:
      - internal-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # 5. MinIO Bucket Initialization
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - internal-net
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-hrminio} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/hr-documents;
      mc mb --ignore-existing local/hr-payslips;
      mc mb --ignore-existing local/hr-attachments;
      mc mb --ignore-existing local/hr-payroll-snapshots;
      echo 'Production buckets ready';
      "

  # ---------------------------------------------------------------------------
  # 6. Spring Boot 3 Modular Monolith Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hr-prod-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      TZ: UTC
      SPRING_PROFILES_ACTIVE: prod
      # DML connection runs as unprivileged hr_app_login to enforce Row-Level Security
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hr}?sslmode=disable
      DB_USER: ${POSTGRES_APP_USER:-hr_app_login}
      DB_PASSWORD: ${POSTGRES_APP_PASSWORD:-hr_app_login}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hr}?sslmode=disable
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_APP_USER:-hr_app_login}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_APP_PASSWORD:-hr_app_login}
      # Flyway migrations run as database owner hr_owner
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hr}?sslmode=disable
      FLYWAY_USER: ${POSTGRES_USER:-hr_owner}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hr}?sslmode=disable
      SPRING_FLYWAY_USER: ${POSTGRES_USER:-hr_owner}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      # Cache & session
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Event streaming
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      # S3 Object store
      HR_STORAGE_S3_ENDPOINT: http://minio:9000
      HR_STORAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-hrminio}
      HR_STORAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      HR_STORAGE_S3_BUCKET_DOCUMENTS: hr-documents
      HR_STORAGE_S3_BUCKET_PAYSLIPS: hr-payslips
      HR_STORAGE_S3_BUCKET_ATTACHMENTS: hr-attachments
      # Security Keys
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?Field cipher key required}
      HR_SECURITY_FIELD_CIPHER_KEY: ${FIELD_ENCRYPTION_KEY:?Field cipher key required}
      HR_AUTH_JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT private key required}
      HR_AUTH_JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT public key required}
    networks:
      - internal-net
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 40s
      retries: 5

  # ---------------------------------------------------------------------------
  # 7. Web Admin Console & Edge Nginx Proxy
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: hr-prod-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - internal-net
      - public-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
