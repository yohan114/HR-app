name: hr-platform

# Local development stack.
#
#   docker compose up -d
#   cd backend && ./gradlew bootRun --args='--spring.profiles.active=local'
#
# Everything is pinned to a specific minor version. "latest" in a dev stack means the day a
# maintainer pushes a breaking change is the day someone's machine stops working for reasons
# unrelated to anything they did.

services:
  postgres:
    image: postgres:16.8-alpine
    container_name: hr-postgres
    environment:
      POSTGRES_DB: hr
      POSTGRES_USER: hr_owner
      POSTGRES_PASSWORD: hr_owner
      # Deterministic collation so index ordering matches production regardless of host locale.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_owner -d hr"]
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - "postgres"
      - "-c"
      - "log_statement=none"
      - "-c"
      - "max_connections=200"

  redis:
    image: redis:7.4-alpine
    container_name: hr-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redpanda rather than Kafka locally: Kafka API compatible, single binary, starts in seconds
  # and uses a fraction of the memory. Production runs managed Kafka.
  redpanda:
    image: redpandadata/redpanda:v24.3.6
    container_name: hr-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --check=false
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: hr-minio
    environment:
      MINIO_ROOT_USER: hrminio
      MINIO_ROOT_PASSWORD: hrminio123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 hrminio hrminio123;
      mc mb --ignore-existing local/hr-documents;
      mc mb --ignore-existing local/hr-payslips;
      mc mb --ignore-existing local/hr-attachments;
      mc mb --ignore-existing local/hr-payroll-snapshots;
      echo 'buckets ready';
      "

  opensearch:
    image: opensearchproject/opensearch:2.19.0
    container_name: hr-opensearch
    environment:
      discovery.type: single-node
      # Local only. Production runs with TLS and authentication enabled.
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  redpanda-data:
  minio-data:
  opensearch-data:
