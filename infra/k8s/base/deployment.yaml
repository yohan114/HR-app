apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-backend
  labels:
    app.kubernetes.io/name: hr-backend
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: hr-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hr-backend
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: hr-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      # Spread across availability zones so losing one does not take the API
      # with it. `ScheduleAnyway` rather than `DoNotSchedule`: during a zone
      # outage we would rather run unbalanced than not at all.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hr-backend

      containers:
        - name: api
          image: hr-backend:latest # replaced per-overlay by kustomize
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: hr-backend-config
                  key: springProfiles

            # Database credentials come from the External Secret, which the
            # operator materialises from Secrets Manager. Nothing here is in
            # the repository and nothing is baked into the image.
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: hr-database
                  key: jdbcUrl
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: hr-database
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hr-database
                  key: password

            # Flyway runs as the schema OWNER; the application above runs as a
            # non-owner role so row-level security applies to it. Conflating
            # the two would silently disable tenant isolation — see ADR 0002.
            - name: FLYWAY_URL
              valueFrom:
                secretKeyRef:
                  name: hr-database-owner
                  key: jdbcUrl
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: hr-database-owner
                  key: username
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hr-database-owner
                  key: password

            - name: HR_AUTH_JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: hr-jwt-signing-key
                  key: privateKey
            - name: HR_AUTH_JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: hr-jwt-signing-key
                  key: publicKey
            - name: HR_AUTH_JWT_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: hr-jwt-signing-key
                  key: keyId

            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: hr-backend-config
                  key: redisHost

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: hr-backend-config
                  key: otlpEndpoint
            - name: OTEL_SERVICE_NAME
              value: hr-backend

          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              # No CPU limit, deliberately. CPU limits cause throttling that
              # shows up as unexplained latency spikes; the request already
              # guarantees a share, and the horizontal autoscaler handles
              # sustained load. Memory IS limited, because a leak must kill the
              # pod rather than the node.
              memory: 1Gi

          # Startup probe first: Flyway migrations and Hibernate validation can
          # take a while on a cold database, and without this the liveness
          # probe would kill the pod mid-migration and retry forever.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60 # up to 5 minutes to start

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            # Higher than readiness on purpose: a slow dependency should take a
            # pod out of the load balancer, not restart it.
            failureThreshold: 5

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        # The root filesystem is read-only, but the JVM needs somewhere to
        # write temp files and perf data.
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi

      # Long enough for in-flight requests to finish. Spring Boot's graceful
      # shutdown stops accepting new connections immediately and drains the
      # rest.
      terminationGracePeriodSeconds: 45
