# External Secrets Operator resources (P0-OPS-05).
#
# These are the bridge between AWS Secrets Manager and the Kubernetes Secrets
# the deployment consumes. The point of the arrangement:
#
#   - No secret value exists in this repository, in a container image, or in
#     Terraform state.
#   - The operator authenticates with an IRSA role scoped by ARN prefix to one
#     environment, so a staging cluster cannot read production secrets even if
#     someone applies the wrong manifest.
#   - Values refresh on a schedule, so rotating a credential in Secrets Manager
#     propagates without a redeploy.
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      # region and the service account name are patched per-overlay.
      region: ap-southeast-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
---
# The non-owner role the application authenticates as. Subject to row-level
# security — this is the credential that makes tenant isolation real.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hr-database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: hr-database
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: hr/database/application
---
# The schema owner, used ONLY by Flyway at startup. Kept as a separate secret
# rather than extra keys on the one above so that the blast radius of a leak is
# visibly different, and so a future migration job can mount this without also
# receiving the application credential.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hr-database-owner
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: hr-database-owner
    creationPolicy: Owner
  dataFrom:
    - extract:
        # Managed by RDS itself and rotated automatically, so the password
        # never passes through Terraform.
        key: hr/database/owner
---
# RSA keypair signing access tokens.
#
# If this is absent the application generates an ephemeral keypair at startup
# and logs a loud warning — fine on a laptop, catastrophic in a deployment,
# because every restart invalidates all outstanding tokens and instances cannot
# verify each other's. See JwtKeyProvider.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hr-jwt-signing-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: hr-jwt-signing-key
    creationPolicy: Owner
  data:
    - secretKey: privateKey
      remoteRef:
        key: hr/jwt-signing-key
        property: privateKey
    - secretKey: publicKey
      remoteRef:
        key: hr/jwt-signing-key
        property: publicKey
    - secretKey: keyId
      remoteRef:
        key: hr/jwt-signing-key
        property: keyId
