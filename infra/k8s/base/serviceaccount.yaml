apiVersion: v1
kind: ServiceAccount
metadata:
  name: hr-backend
  # IRSA role ARN is added per-overlay: it embeds the account id and
  # environment, neither of which belongs in a base manifest.
  annotations: {}
# The API pod calls no AWS API directly — credentials reach it as environment
# variables from Kubernetes Secrets. It therefore does not need a projected
# token, and mounting one would be handing out an unnecessary credential.
automountServiceAccountToken: false
