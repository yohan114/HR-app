apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hr-prod

resources:
  - ../../base

# See staging/kustomization.yaml. Production values come from the production
# AWS account's Terraform outputs — a separate account, so a staging render
# cannot accidentally produce a production overlay.
components:
  - generated

replicas:
  - name: hr-backend
    count: 3

patches:
  - path: generated/config-patch.yaml
  - path: generated/serviceaccount-patch.yaml
