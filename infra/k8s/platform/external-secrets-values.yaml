# External Secrets Operator
#
# The service account is created here, but its IRSA annotation is applied
# separately from the Terraform-rendered patch — the role ARN is
# environment-specific and does not belong in a committed values file.

installCRDs: true

serviceAccount:
  create: true
  name: external-secrets
  # Applied by:
  #   kubectl apply -f overlays/<env>/generated/external-secrets-serviceaccount-patch.yaml
  annotations: {}

replicaCount: 2

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

securityContext:
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

webhook:
  replicaCount: 2

certController:
  replicaCount: 1

extraArgs:
  loglevel: info
