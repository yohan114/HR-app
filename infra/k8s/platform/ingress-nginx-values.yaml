# ingress-nginx
controller:
  replicaCount: 2

  service:
    type: LoadBalancer
    annotations:
      # NLB rather than the classic ELB: it preserves the client source IP,
      # which the application's rate limiting and audit log both depend on.
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
      service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"

  config:
    # TLS 1.2 as the floor. 1.0 and 1.1 are deprecated and would fail any
    # security review of a system holding payroll data.
    ssl-protocols: "TLSv1.2 TLSv1.3"
    ssl-ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305"

    # Two years, with preload. Only enable once the domain is committed to
    # HTTPS permanently — browsers honour an HSTS header long after it is
    # withdrawn, so a mistake here is not quickly reversible.
    hsts: "true"
    hsts-max-age: "63072000"
    hsts-include-subdomains: "true"
    hsts-preload: "true"

    # Payslip PDFs and bulk employee imports both exceed the 1 MB default.
    proxy-body-size: "25m"

    # Report the real client IP rather than the load balancer's.
    use-forwarded-headers: "true"
    compute-full-forwarded-for: "true"

    # Long enough for a bulk import to be accepted, short enough that a stuck
    # request does not hold a worker indefinitely.
    proxy-read-timeout: "120"
    proxy-send-timeout: "120"

    log-format-escape-json: "true"

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 512Mi

  metrics:
    enabled: true

  # One controller pod per node, so a node loss cannot take out both.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
          app.kubernetes.io/component: controller

  admissionWebhooks:
    enabled: true

  # Configuration snippets in Ingress annotations are arbitrary nginx config.
  # With them enabled, anyone able to create an Ingress could rewrite routing
  # or leak headers — a well-known privilege escalation path in shared
  # clusters.
  allowSnippetAnnotations: false
